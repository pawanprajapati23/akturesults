        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }

        header { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%); color: white; padding: 25px 0; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }

<body>
    <header>
        <div class="container">
            <a href="/" class="site-title">🎓 AKTU Results <span>2026</span></a>
        </div>
    </header>

    <nav class="breadcrumb">
        <div class="container">
            <a href="/">Home</a> <span>›</span> <a href="/tools/">Tools</a> <span>›</span> <span>AKTU Attendance Bunk Calculator</span>
        </div>
    </nav>

    <div class="container">
        <section class="hero-banner">
            <h1>😎 AKTU 75% Attendance & Bunk Calculator</h1>
            <p>Calculate your current attendance percentage, exact safe bunk limit, or required consecutive classes to avoid AKTU ERP debarred list.</p>
        </section>

        <section class="calc-card">
            <form onsubmit="calculateBunk(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="classesHeld">Total Classes Conducted So Far *</label>
                        <input type="number" id="classesHeld" class="form-control" placeholder="e.g. 60" required min="1" />
                    </div>

                    <div class="form-group">
                        <label for="classesAttended">Classes Attended by You *</label>
                        <input type="number" id="classesAttended" class="form-control" placeholder="e.g. 50" required min="0" />
                    </div>
                </div>

                <button type="submit" class="btn-calc">💥 Calculate Safe Bunks & Attendance %</button>
            </form>

            <div id="resBox" class="res-box">
                <div id="resHeading" style="font-size:22px; font-weight:800; margin-bottom:8px;"></div>
                <div id="resBody" style="font-size:16px;"></div>
            </div>
        </section>
    </div>

    <script>
        function calculateBunk(e) {
            e.preventDefault();
            const held = parseInt(document.getElementById('classesHeld').value);
            const attended = parseInt(document.getElementById('classesAttended').value);

            if (attended > held) {
                alert("Attended classes cannot be greater than total classes held!");
                return;
            }

            const perc = ((attended / held) * 100).toFixed(2);
            const resBox = document.getElementById('resBox');
            const heading = document.getElementById('resHeading');
            const body = document.getElementById('resBody');

            if (perc >= 75) {
                // Formula for safe bunks: floor((attended - 0.75 * held) / 0.75)
                const safeBunks = Math.floor((attended - 0.75 * held) / 0.75);
                resBox.style.background = '#dcfce7';
                resBox.style.borderColor = '#16a34a';
                heading.style.color = '#15803d';
                heading.innerText = `🎉 Safe Zone! Current Attendance: ${perc}%`;
                body.innerHTML = `You can safely <strong>BUNK next ${safeBunks} classes</strong> and your attendance will still stay at or above 75%!`;
            } else {
                // Formula for required consecutive classes: ceil((0.75 * held - attended) / 0.25)
                const reqClasses = Math.ceil((0.75 * held - attended) / 0.25);
                resBox.style.background = '#fee2e2';
                resBox.style.borderColor = '#dc2626';
                heading.style.color = '#b91c1c';
                heading.innerText = `🚨 Shortage Alert! Current Attendance: ${perc}%`;
                body.innerHTML = `You are below 75%! You MUST attend the next <strong>${reqClasses} CONSECUTIVE classes</strong> without missing any to reach 75% safe attendance.`;
            }

            resBox.style.display = 'block';
        }
    </script>

    <footer>
        <div class="container"><p>&copy; 2026 AKTU Results Portal. All rights reserved.</p></div>
    </footer>
</body>

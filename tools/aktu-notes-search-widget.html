    <script>
        const subjectDB = [
            { name: "Data Structures (DS)", code: "BCS-301", sem: "3rd Sem", branch: "CSE/IT", link: "/syllabus/aktu-quantum-pdf-downloads.html" },
            { name: "Computer Organization & Arch (COA)", code: "BCS-302", sem: "3rd Sem", branch: "CSE/IT", link: "/syllabus/aktu-quantum-pdf-downloads.html" },

            { name: "Artificial Intelligence (AI)", code: "BCS-701", sem: "7th Sem", branch: "CSE/IT", link: "/syllabus/aktu-quantum-pdf-downloads.html" },
            { name: "Engineering Physics", code: "BAS-101", sem: "1st Sem", branch: "All Branches", link: "/syllabus/aktu-quantum-pdf-downloads.html" },
            { name: "Engineering Mathematics-I", code: "BAS-103", sem: "1st Sem", branch: "All Branches", link: "/syllabus/aktu-quantum-pdf-downloads.html" }
        ];

        function searchNotes() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = '';

            const filtered = subjectDB.filter(s => s.name.toLowerCase().includes(query) || s.code.toLowerCase().includes(query) || s.branch.toLowerCase().includes(query));

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'res-card';
                card.innerHTML = `
                    <div style="font-size:12px; font-weight:700; color:#4f46e5; margin-bottom:4px;">${item.branch} | ${item.sem} (${item.code})</div>
                    <div style="font-size:16px; font-weight:700; color:#0f172a; margin-bottom:12px;">${item.name}</div>

                grid.appendChild(card);
            });
        }

        searchNotes();
